{% extends "base.html" %}

{% block title %}404 — Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-1 fw-bold text-secondary">404</h1>
  <h2 class="mb-3">Page Not Found</h2>
  <p class="text-muted mb-4">
    The ticket or resource you are looking for does not exist or has been removed.
  </p>
  <a href="{{ url_for('ui.ticket_list') }}" class="btn btn-primary">Back to Ticket List</a>
</div>
{% endblock %}
